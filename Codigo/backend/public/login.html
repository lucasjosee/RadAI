<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>RadAi - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { width: 400px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="card">
        <h3 class="text-center mb-4">Acesso ao Sistema</h3>
        
        <div class="mb-3">
            <label>Email</label>
            <input type="email" id="email" class="form-control" placeholder="ex: lucas@medico.com">
        </div>
        
        <div class="mb-3">
            <label>Senha</label>
            <input type="password" id="senha" class="form-control">
        </div>
        
        <button onclick="fazerLogin()" class="btn btn-primary w-100 mb-3">Entrar</button>
        
        <div class="text-center">
            <a href="cadastro.html" class="text-decoration-none">Não tem conta? <strong>Cadastre-se aqui</strong></a>
        </div>
        
        <p id="mensagem" class="text-danger text-center mt-3"></p>
    </div>

    <script>
        async function fazerLogin() {
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const mensagem = document.getElementById("mensagem");

            mensagem.innerText = "Verificando credenciais...";
            mensagem.style.color = "blue";

            try {
                const response = await fetch("http://localhost:8080/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email, senha: senha })
                });

                if (response.ok) {
                    const usuario = await response.json();
                    
                    if(usuario.tipo === "MEDICO") {
                        window.location.href = "medico.html";
                    } else {
                        window.location.href = "dashboard.html";
                    }
                    
                } else {
                    mensagem.style.color = "red";
                    mensagem.innerText = "Email ou senha incorretos!";
                }
            } catch (error) {
                console.error(error);
                mensagem.innerText = "Erro ao conectar com o servidor.";
            }
        }
    </script>
</body>
</html>
