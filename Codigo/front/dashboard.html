<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo - Secretária</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { height: 100vh; overflow: hidden; }
        .sidebar { height: 100%; background-color: #343a40; color: white; padding-top: 20px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 15px 20px; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background-color: #0d6efd; }
        .content { height: 100%; overflow-y: auto; padding: 20px; background-color: #f8f9fa; }
    </style>
</head>
<body class="d-flex">

    <div class="sidebar d-flex flex-column" style="width: 250px;">
        <h4 class="text-center mb-4">RadAi</h4>
        
        <a href="#" class="active" onclick="mostrarTela('pacientes', this)"><i class="bi bi-people"></i> Pacientes</a>
        <a href="#" onclick="mostrarTela('consultas', this)"><i class="bi bi-calendar-check"></i> Consultas</a>
        <a href="cadastro.html" onclick=""><i class="bi bi-person-plus"></i> Novo Usuário</a>
        
        <div class="mt-auto">
            <a href="login.html" class="bg-danger text-center mt-4">Sair do Sistema</a>
        </div>
    </div>

    <div class="content flex-grow-1">
        
        <div id="tela-pacientes">
            <h2>Gestão de Pacientes</h2>
            <hr>
            <div class="row">
                <div class="col-md-4">
                    <div class="card p-3 shadow-sm">
                        <h5>Novo Cadastro</h5>
                        <form onsubmit="cadastrarPaciente(event)">
                            <input type="text" id="nome" class="form-control mb-2" placeholder="Nome Completo" required>
                            <input type="email" id="email" class="form-control mb-2" placeholder="Email">
                            <input type="text" id="cpf" class="form-control mb-2" placeholder="CPF" required>
                            <input type="text" id="telefone" class="form-control mb-2" placeholder="Telefone">
                            <label>Nascimento:</label>
                            <input type="date" id="nascimento" class="form-control mb-2">
                            <textarea id="endereco" class="form-control mb-2" placeholder="Endereço"></textarea>
                            <button type="submit" class="btn btn-success w-100">Salvar Paciente</button>
                        </form>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="card p-3 shadow-sm">
                        <div class="d-flex justify-content-between">
                            <h5>Base de Pacientes</h5>
                            <button onclick="carregarPacientes()" class="btn btn-sm btn-outline-primary">Atualizar</button>
                        </div>
                        <table class="table table-striped mt-2">
                            <thead><tr><th>ID</th><th>Nome</th><th>CPF</th><th>Ação</th></tr></thead>
                            <tbody id="tabelaPacientes"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div id="tela-consultas" class="d-none">
            <h2>Agenda de Consultas</h2>
            <hr>
            <div class="card p-3 shadow-sm">
                <div class="d-flex justify-content-between">
                    <h5>Histórico de Agendamentos</h5>
                    <button onclick="carregarConsultas()" class="btn btn-sm btn-outline-primary">Atualizar Lista</button>
                </div>
                <table class="table table-hover mt-3">
                    <thead class="table-dark">
                        <tr><th>ID</th><th>Paciente ID</th><th>Data/Hora</th><th>Sintomas</th><th>Status</th></tr>
                    </thead>
                    <tbody id="tabelaConsultas"></tbody>
                </table>
            </div>
        </div>

    </div>

    <div class="modal fade" id="modalAgendamento" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Agendar Consulta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="idPacienteConsulta">
                    <p>Paciente: <strong id="nomePacienteConsulta">...</strong></p>
                    <label>Data:</label>
                    <input type="datetime-local" id="dataHora" class="form-control mb-2">
                    <label>Sintomas:</label>
                    <textarea id="sintomas" class="form-control" rows="3"></textarea>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="salvarConsulta()">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- NAVEGAÇÃO ENTRE ABAS ---
        function mostrarTela(tela, elementoLink) {
            // Esconde todas
            document.getElementById('tela-pacientes').classList.add('d-none');
            document.getElementById('tela-consultas').classList.add('d-none');
            
            // Remove ativo do menu
            document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
            
            // Mostra a escolhida
            document.getElementById('tela-' + tela).classList.remove('d-none');
            elementoLink.classList.add('active');

            if(tela === 'pacientes') carregarPacientes();
            if(tela === 'consultas') carregarConsultas();
        }

        // --- LÓGICA DE PACIENTES ---
        async function cadastrarPaciente(e) {
            e.preventDefault();
            const p = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                cpf: document.getElementById('cpf').value,
                telefone: document.getElementById('telefone').value,
                nascimento: document.getElementById('nascimento').value,
                endereco: document.getElementById('endereco').value
            };
            await fetch('http://localhost:8080/pacientes', {
                method: 'POST', body: JSON.stringify(p)
            });
            alert("Paciente Cadastrado!");
            carregarPacientes();
        }

        async function carregarPacientes() {
            const res = await fetch('http://localhost:8080/pacientes');
            const lista = await res.json();
            const tbody = document.getElementById('tabelaPacientes');
            tbody.innerHTML = '';
            lista.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.nome}</td>
                        <td>${p.cpf}</td>
                        <td><button class="btn btn-sm btn-info text-white" onclick="abrirModal('${p.id}', '${p.nome}')">Agendar</button></td>
                    </tr>`;
            });
        }

        // --- LÓGICA DE CONSULTAS ---
        function abrirModal(id, nome) {
            document.getElementById('idPacienteConsulta').value = id;
            document.getElementById('nomePacienteConsulta').innerText = nome;
            new bootstrap.Modal(document.getElementById('modalAgendamento')).show();
        }

        async function salvarConsulta() {
            const c = {
                paciente_id: document.getElementById('idPacienteConsulta').value,
                data_hora: document.getElementById('dataHora').value,
                sintomas: document.getElementById('sintomas').value
            };
            await fetch('http://localhost:8080/consultas', { method: 'POST', body: JSON.stringify(c) });
            alert("Agendado!");
            window.location.reload();
        }

        async function carregarConsultas() {
            const res = await fetch('http://localhost:8080/consultas-lista');
            const lista = await res.json();
            const tbody = document.getElementById('tabelaConsultas');
            tbody.innerHTML = '';
            lista.forEach(c => {
                tbody.innerHTML += `
                    <tr><td>${c.id}</td><td>${c.paciente_id}</td><td>${c.data_hora}</td><td>${c.sintomas}</td><td>${c.status || 'Agendada'}</td></tr>`;
            });
        }

        // Inicia carregando pacientes
        carregarPacientes();
    </script>
</body>
</html>
